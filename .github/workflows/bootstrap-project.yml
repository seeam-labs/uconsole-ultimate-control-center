name: Publish complete project source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-project.yml"
      - ".bootstrap/project.xz.b64.part15"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.xz.b64.part* > /tmp/project.xz.b64
          base64 --decode /tmp/project.xz.b64 > /tmp/project.tar.xz
          echo "a7dd03937ed16bb136b4d2927d41ae39e15f065ca477a528d0f70af5ea70124a  /tmp/project.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/project
          tar -xJf /tmp/project.tar.xz -C /tmp/project --strip-components=1
          test -f /tmp/project/README.md
          test -f /tmp/project/install.sh
          test -f /tmp/project/pyproject.toml
          test -d /tmp/project/src
          test -d /tmp/project/docs
          test -d /tmp/project/.github

      - name: Replace bootstrap content with complete project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/project/. .
          rm -rf .bootstrap

      - name: Commit and push complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seeam Rahman"
          git config user.email "seeam.labs@proton.me"
          git add -A
          git commit -m "Publish complete uConsole Ultimate Control Center source"
          git push origin HEAD:main
